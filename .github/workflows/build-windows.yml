name: Build Windows

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.x"
      - name: Validate identity
        shell: pwsh
        run: |
          python tests/identity/validate_identity.py
          python tests/characterization/test_inherited_contract.py
          python tests/characterization/test_state_contract.py
      - name: Fetch pinned iPlug SDKs and libraries
        shell: bash
        run: |
          cd iPlug2/Dependencies/IPlug
          ./download-iplug-sdks.sh
          cd ..
          ./download-prebuilt-libs.sh
      - name: Build standalone and VST3
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP "amphibia-vst3-stage"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          msbuild NeuralAmpModeler/Amphibia.sln "/t:Amphibia-app;Amphibia-vst3" "/p:Configuration=Release;Platform=x64;VST3_64_PATH=$stage" /m /nologo
      - name: Build and run foundation tests
        shell: pwsh
        run: |
          msbuild tests/milestone2/Milestone2Tests.vcxproj /t:Build "/p:Configuration=Release;Platform=x64" /m /nologo
          & tests/milestone2/build/x64/Release/Milestone2Tests.exe
          msbuild tests/milestone3/Milestone3Tests.vcxproj /t:Build "/p:Configuration=Release;Platform=x64" /m /nologo
          & tests/milestone3/build/x64/Release/Milestone3Tests.exe
          msbuild tests/milestone4/Milestone4Tests.vcxproj /t:Build "/p:Configuration=Release;Platform=x64" /m /nologo
          & tests/milestone4/build/x64/Release/Milestone4Tests.exe
      - name: Upload development artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Amphibia-windows-development
          path: |
            NeuralAmpModeler/build-win/app/x64/Release/Amphibia.exe
            NeuralAmpModeler/build-win/Amphibia.vst3
          if-no-files-found: error
